# AgentConnect Configuration
# This file contains developer-facing configuration options.
# Secrets and API keys should be set as environment variables, not here.

# Global settings
project_name: "AgentConnect"

# Agent Registry configuration
registry:
  vector_search:
    model_name: "sentence-transformers/all-mpnet-base-v2"
    cache_folder: "./.cache/huggingface/embeddings"
    vector_store_path: "./.cache/vector_stores"

    # Deployment mode (exactly one)
    deployment:
      type: "in_memory"  # "local_file" or "remote" also supported
      # For local_file: path: "./local_qdrant_db"
      # For remote: url: "http://localhost:6333" (API key via QDRANT_API_KEY)

    # Advanced tuning (optional)
    advanced:
      timeout: 30
      grpc_port: null
      prefer_grpc: false
      use_quantization: true
      vectors_on_disk: false
      index_on_disk: false
      batch_size: 100

# Payments configuration
# Agent wallets are local keys on Celo mainnet (no API keys). Celo Sepolia testnet:
# chain_id "11142220", rpc_url "https://forno.celo-sepolia.celo-testnet.org".
payments:
  default_token_symbol: "USDC"      # e.g., USDC or CELO; drives ERC-20 vs native tools
  chain_id: "42220"                 # Celo mainnet
  rpc_url: "https://forno.celo.org"
  x402_seller_asset: "USAT"         # token an agent charges in when selling over x402
  x402_pay_to: ""                   # payTo for x402 sales (empty = the agent wallet)
  erc8004_agent_id: ""              # ERC-8004 identity id (informational)
  x402_max_amount_per_payment: "$0.50"  # per-payment cap when an agent pays an x402 (HTTP 402) endpoint
  attribution_data_suffix: ""       # optional ERC-8021 suffix (0x...) appended to every tx
  wallet_data_dir: "data/agent_wallets"  # where agent wallets are stored (non-secret path)

# Communication system settings
communication:
  enable_message_history: true  # Track message history (disable for performance)

# Client configurations
clients:
  registry:
    base_url: "http://localhost:8000"

# MCP settings
mcp:
  agent_discovery:
    enabled: true
    top_k: 5
    strictness: 0.2
    output_detail: "summary"  # minimal | summary | capabilities | full
